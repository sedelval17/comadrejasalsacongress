name: Publicar revisión en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Cuenta autorizada por el usuario. Una cuenta de empresa no puede desplegar.
    if: github.repository_owner == 'sedelval17'
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v7
      - name: Comprobar, compilar y preparar artefacto
        uses: withastro/action@v6
        with:
          node-version: '22'
          build-cmd: npm run check && npm run build
        env:
          COMADREJA_SITE_URL: https://sedelval17.github.io
          COMADREJA_BASE_PATH: /comadrejasalsacongress
          COMADREJA_PREVIEW: '1'
  deploy:
    if: github.repository_owner == 'sedelval17'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
